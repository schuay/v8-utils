[project]
name = "v8-utils"
version = "0.1.0"
description = "CLI and MCP tools for V8 JavaScript engine developers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-auth>=2.0",
    "protobuf>=5.0",
    "httpx>=0.27",
    "mcp[cli]>=1.0",
    "requests>=2.32.5",
    "scipy>=1.13",
]

[project.scripts]
v8-mcp = "server:mcp.run"
pp = "pp:main"
jsb = "jsb:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
