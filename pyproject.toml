[project]
name = "v8-utils"
version = "0.1.0"
description = "CLI and MCP tools for V8 JavaScript engine developers"
readme = "README.md"
requires-python = ">=3.12"
# The full developer surface, with no extras to remember: every CLI and every MCP
# tool group works after a plain `uv tool install git+...`. Nothing here is
# optional, because a forgotten extra breaks a console script outright (their
# imports run at module scope) and silently drops MCP tool groups.
#
# Deployments that want a subset install the companion v8-utils-core
# distribution instead (packaging/core/pyproject.toml): same code, same entry
# points, but the heavy scientific/cloud stack behind opt-in extras. The two ship
# the same v8_utils module, so they are alternatives, not layers -- install one
# or the other. tests/test_packaging.py pins the two dependency sets together.
dependencies = [
    # Capped below 2.0: the whole mcp_tools surface is built on
    # mcp.server.fastmcp, which 2.0 removed outright (along with
    # mcp.shared.context.RequestContext, which langchain-mcp-adapters still
    # imports). Porting is a real migration, not a version bump.
    "mcp[cli]>=1.0,<2",
    "platformdirs>=4.0",
    # httpx, typer and rich are listed explicitly even though mcp[cli] happens to
    # pull them in today: mcp 2.0 switched to httpx2, and rich only arrives via
    # typer's own dependencies.
    "httpx>=0.27",
    "typer>=0.16",
    "rich>=13.9",
    # Perf-data analysis: the `pd` MCP group and the `pd`/`jsb` CLIs
    # (change-point detection, A/B stats, JetStream comparison).
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.13",
    "ruptures>=1.1",
    "dateparser>=1.3.0",
    # Chromium Pinpoint A/B jobs: the `pinpoint` MCP group and the `pp` CLI.
    # protobuf backs the RBE/CAS wire types (cas_api); scipy above backs the
    # Mann-Whitney stats.
    "protobuf>=5.0",
    # Google Chat frontend (pp/daemon): impersonated-credential auth.
    "google-auth>=2.0",
    # Spanner-backed perf timeseries (the pd `skiz` adaptor, imported lazily).
    "google-cloud-spanner>=3.63.0",
    # TODO(jgruber): remove once PyPI has an unyanked stable release.
    # google-cloud-spanner depends on opentelemetry-resourcedetector-gcp, whose
    # only stable release is yanked (alphas only remain). uv enables
    # pre-releases for a package only via a DIRECT pre-release-marked
    # requirement, so this pin opts in exactly this one package.
    "opentelemetry-resourcedetector-gcp>=1.8.0a0",
]

[project.optional-dependencies]
# `v8-utils[all]` was the documented install command while the heavy stack was
# optional, and it still sits in shell history and older notes. Keep it resolving
# (an unknown extra only warns, but the warning is noise) now that it is the
# default. The per-group extras moved to v8-utils-core.
all = []

[project.scripts]
v8-mcp = "v8_utils.server:main"
pp = "v8_utils.cli_deps:pp"
jsb = "v8_utils.cli_deps:jsb"
pd = "v8_utils.cli_deps:pd"
lv = "v8_utils.lv:main"
vt = "v8_utils.vt:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/v8_utils"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.4",
    # Requirement parsing in tests/test_packaging.py. Present transitively via
    # pytest today; declared because a test depends on it directly.
    "packaging>=24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
