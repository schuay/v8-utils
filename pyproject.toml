[project]
name = "v8-utils"
version = "0.1.0"
description = "CLI and MCP tools for V8 JavaScript engine developers"
readme = "README.md"
requires-python = ">=3.12"
# Base install: only what the MCP server core and its light tool groups need.
# httpx, typer and rich are listed explicitly even though mcp[cli] happens to
# pull them in today: mcp 2.0 switched to httpx2, and rich only arrives via
# typer's own dependencies. The heavy scientific/cloud stack lives in the extras
# below and is imported lazily per tool group -- a base-only install runs the
# server with the repo_git, worktree, and gerrit groups and skips the rest with a
# clear warning (see mcp_tools.build_server). Install v8-utils[all] for the full
# developer surface.
dependencies = [
    # Capped below 2.0: the whole mcp_tools surface is built on
    # mcp.server.fastmcp, which 2.0 removed outright (along with
    # mcp.shared.context.RequestContext, which langchain-mcp-adapters still
    # imports). Porting is a real migration, not a version bump.
    "mcp[cli]>=1.0,<2",
    "platformdirs>=4.0",
    "httpx>=0.27",
    "typer>=0.16",
    "rich>=13.9",
]

[project.optional-dependencies]
# Perf-data analysis: the `pd` MCP group and the `pd`/`jsb` CLIs (change-point
# detection, A/B stats, JetStream comparison).
analysis = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.13",
    "ruptures>=1.1",
    "dateparser>=1.3.0",
]
# Chromium Pinpoint A/B jobs: the `pinpoint` MCP group and the `pp` CLI. protobuf
# backs the RBE/CAS wire types (cas_api); scipy backs the Mann-Whitney stats.
pinpoint = [
    "scipy>=1.13",
    "protobuf>=5.0",
    "dateparser>=1.3.0",
]
# Google Chat frontend (pp/daemon): impersonated-credential auth.
gchat = [
    "google-auth>=2.0",
]
# Spanner-backed perf timeseries (the pd `skiz` adaptor, imported lazily).
spanner = [
    "google-cloud-spanner>=3.63.0",
    # TODO(jgruber): remove once PyPI has an unyanked stable release.
    # google-cloud-spanner depends on opentelemetry-resourcedetector-gcp, whose
    # only stable release is yanked (alphas only remain). uv enables
    # pre-releases for a package only via a DIRECT pre-release-marked
    # requirement, so this pin opts in exactly this one package.
    "opentelemetry-resourcedetector-gcp>=1.8.0a0",
]
# The full developer surface -- equivalent to the pre-split dependency set.
# Recursive extras are resolved by uv and modern pip.
all = [
    "v8-utils[analysis,pinpoint,gchat,spanner]",
]

# The CLIs below import their dependencies at module scope, so a console script
# is broken outright if its extra is missing -- unlike the MCP groups, which
# build_server can skip with a warning. `uv tool install` cannot pick extras per
# entry point, so anyone installing for the CLIs needs v8-utils[all].
[project.scripts]
v8-mcp = "v8_utils.server:main"
pp = "v8_utils.cli_deps:pp"
jsb = "v8_utils.cli_deps:jsb"
pd = "v8_utils.cli_deps:pd"
lv = "v8_utils.lv:main"
vt = "v8_utils.vt:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/v8_utils"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
