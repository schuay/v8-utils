[project]
name = "v8-mcp"
version = "0.1.0"
description = "MCP server exposing tools for V8 JavaScript engine developers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp[cli]>=1.0",
    "scipy>=1.13",
]

[project.scripts]
v8-mcp = "server:mcp.run"
pp = "pp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
