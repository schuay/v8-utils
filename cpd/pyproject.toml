[project]
name = "cpd"
version = "0.1.0"
description = "PELT change-point detection for benchmark time series"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "ruptures>=1.1",
    "scipy>=1.13",
    "pandas>=2.0",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
cpd = "cpd.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cpd"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
